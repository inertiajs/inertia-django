name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

jobs:
  unit-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: '3.10'
            django: '>=5.2,<5.3'
          - python-version: '3.12'
            django: '>=6.1,<7'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra ssr
      - run: uv run --locked --with "django${{ matrix.django }}" pytest -v -ra --cov --cov-report=term-missing
  v3-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: inertia/tests/v3_frontend/package-lock.json
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.12'
      - run: uv sync --locked --extra ssr
      - run: npm ci
        working-directory: inertia/tests/v3_frontend
      - run: npx playwright install --with-deps chromium
        working-directory: inertia/tests/v3_frontend
      - run: npm run test:compat
        working-directory: inertia/tests/v3_frontend
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.12'
      - run: uv build --no-sources .
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v4.1.0
      - run: ruff check
      - run: ruff format --check
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.12'
      - run: uv sync --locked --extra ssr
      - run: uv run mypy .
