name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5.4.0
        with:
          python-version: '3.12'
      - run: uvx poetry install --extras=ssr
      - run: uvx poetry run pytest -v -ra --cov --cov-report=term-missing
        env:
          COVERAGE_CORE: sysmon
  v3-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: inertia/tests/v3_frontend/package-lock.json
      - uses: astral-sh/setup-uv@v5.4.0
        with:
          python-version: '3.12'
      - run: uv tool install poetry
      - run: PATH="$HOME/.local/bin:$PATH" poetry install --extras=ssr
      - run: npm ci
        working-directory: inertia/tests/v3_frontend
      - run: npx playwright install --with-deps chromium
        working-directory: inertia/tests/v3_frontend
      - run: PATH="$HOME/.local/bin:$PATH" npm run test:compat
        working-directory: inertia/tests/v3_frontend
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5.4.0
        with:
          python-version: '3.12'
      - run: uv build .
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
      - run: ruff check
      - run: ruff format --check
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5.4.0
        with:
          python-version: '3.12'
      - run: uvx poetry install --extras=ssr
      - run: uvx poetry run mypy .
